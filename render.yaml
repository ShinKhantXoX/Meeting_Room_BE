databases:
  - name: meeting_room_db_jb1e
    plan: free
    databaseName: meeting_room
    user: meeting_room_db_jb1e_user

services:
  - type: web
    name: Meeting_Room_BE
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm run render:start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting_room_db_jb1e
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
