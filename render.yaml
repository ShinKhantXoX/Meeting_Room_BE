databases:
  - name: meeting-room-db
    plan: free
    databaseName: meeting_room
    user: meeting_room_user

services:
  - type: web
    name: meeting-room-api
    runtime: node
    plan: free
    buildCommand: npm run render:build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: meeting-room-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
